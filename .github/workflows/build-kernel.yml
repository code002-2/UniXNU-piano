name: build-piano-kernel

# Builds the XNU kernel for the Xiaomi Pad 8 Pro (piano, SM8750) on an Apple
# Silicon macOS runner, which is what the UniXNU kernel step requires: it drives
# xnu's makefiles with `xcodebuild` and the iphoneos SDK, and generates its Mach
# stubs with Apple's MIG, which is not available outside Xcode.
#
# The output is the prelinked kernel.macho the UniXNU payload step consumes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'board.toml'
      - 'configs/**'
      - 'scripts/**'
      - 'package/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-latest       # Apple Silicon; the newest Xcode, which is what UniXNU tracks
    timeout-minutes: 240

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-piano

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i '^Xcode' || true
          xcrun -sdk iphoneos -find mig || echo 'mig not found for iphoneos'
          xcrun -sdk iphoneos -find iig || echo 'iig not found for iphoneos'

      - name: Install the host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          # unifdef and llvm are keg-only; unixnu looks in /opt/homebrew/opt/llvm/bin
          # on its own, but PATH keeps the rest predictable.
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/unifdef/bin" >> "$GITHUB_PATH"

      - name: Verify the tools unixnu checks for
        run: |
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Check out UniXNU
        run: git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU

      - name: Select the device repository
        working-directory: UniXNU
        run: |
          ./unixnu defconfig piano_defconfig -D ../UniXNU-piano
          ./unixnu status

      - name: Fetch the Apple references
        working-directory: UniXNU
        run: ./unixnu fetch

      - name: Fetch the target IPSW members
        working-directory: UniXNU
        run: ./unixnu ipsw fetch

      - name: Assemble the tree and build the display probe archive
        working-directory: UniXNU
        # bsd_init.c declares the display probe hooks under
        # '#if DEVELOPMENT || DEBUG', which the kernel configuration always
        # takes, so they must resolve even though piano has no display provider
        # yet. stubs/PianoDisplayProbe.c supplies the 'no provider' versions and
        # configs/*_defconfig link it through CONFIG_XNU_EXTRA_LD_ARCHIVES.
        run: |
          ./unixnu tree
          bash ../UniXNU-piano/scripts/build-piano-display-stub.sh out/piano/tree ../UniXNU-piano

      - name: Seed kernel build for the corecrypto symbol table
        working-directory: UniXNU
        # build-corecrypto-14.py --namespace reads the kernel's undefined symbols
        # to decide which provider symbols to rename. A crypto-enabled build
        # cannot link before that archive exists, so this pass runs with the
        # crypto tree switched off. See configs/piano_seed_defconfig.
        run: |
          ./unixnu defconfig piano_seed_defconfig -D ../UniXNU-piano
          ./unixnu build kernel || echo "seed pass did not finish; the object file is what matters"
          ls -l out/piano/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          # A kernel from the seed configuration must never be shipped.
          rm -f out/piano/kernel/kernel.macho

      - name: Build the pinned corecrypto provider
        working-directory: UniXNU
        # With XNU_SOURCE_CORECRYPTO14 the kernel links the source corecrypto
        # provider, and the build script requires this archive to exist:
        #   build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a
        # UniXNU produces it with scripts/build-corecrypto-14.py, which nothing
        # in the driver calls, so the CI runs it explicitly: plain first, then
        # the namespaced variant.
        run: |
          ./unixnu tree
          workspace=out/piano/tree
          git clone --quiet https://github.com/ONLYA/corecrypto-2023 "$workspace/refer/corecrypto-2023"
          git -C "$workspace/refer/corecrypto-2023" checkout --quiet 11fba65b12d8830630e248dfa8344caf8b065f26
          git -C "$workspace/refer/corecrypto-2023" rev-parse HEAD
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py --namespace )
          ls -l "$workspace/build/corecrypto-2023/"*.a

      - name: Build and prelink the kernel
        working-directory: UniXNU
        run: |
          ./unixnu defconfig piano_defconfig -D ../UniXNU-piano
          ./unixnu build kernel

      - name: Record the result
        working-directory: UniXNU
        if: always()
        run: |
          mkdir -p ../artifacts
          if [ -f out/piano/kernel/kernel.macho ]; then
            cp out/piano/kernel/kernel.macho ../artifacts/
            shasum -a 256 out/piano/kernel/kernel.macho | tee ../artifacts/kernel.macho.sha256
          else
            echo "kernel.macho was not produced" | tee ../artifacts/MISSING.txt
          fi
          find out/piano/build/xnu -name 'mach.development.bcm2837*' -type f 2>/dev/null \
            -exec cp {} ../artifacts/ \; || true
          cp -r out/piano/logs ../artifacts/logs 2>/dev/null || true
          ls -l ../artifacts

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-kernel
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
